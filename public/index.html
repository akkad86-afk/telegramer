<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מבזקי טלגרם</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e8ecf0;
    --surface: #ffffff;
    --ink: #172033;
    --muted: #5a6677;
    --line: #d3dae2;
    --accent: #0b6e6e;
    --accent-ink: #ffffff;
    --chip: #f4f6f8;
    --shadow: 0 1px 0 rgba(23,32,51,.06);
    --c0: #0b6e6e; --c1: #b4491f; --c2: #4a5bb5; --c3: #8a6a00; --c4: #a3366b;
    --c5: #2f7d3a; --c6: #6a4c93; --c7: #1c6fa8; --c8: #7a5a44;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10161f; --surface: #1a222e; --ink: #e8edf3; --muted: #94a1b3;
      --line: #2b3646; --accent: #4fc1bd; --accent-ink: #08201f; --chip: #222c3a;
      --shadow: none;
      --c0: #4fc1bd; --c1: #f0925f; --c2: #8c9bf0; --c3: #e0bb4a; --c4: #e57fb0;
      --c5: #6fc67b; --c6: #b39ae0; --c7: #63b2ec; --c8: #c9a48c;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 120px); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Assistant", "Segoe UI", Arial, sans-serif; font-size: 17px; line-height: 1.55;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding-top: env(safe-area-inset-top, 0px);
    margin-top: calc(env(safe-area-inset-top, 0px) * -1);
  }
  .wrap { max-width: 700px; margin: 0 auto; padding: 0 16px; }
  .bar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 14px 0 8px; }
  h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -.01em; }
  .bar { flex-wrap: wrap; align-items: center; }
  .status { color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 10px; }
  .refresh {
    font: inherit; font-size: 15px; font-weight: 600; color: var(--accent-ink); background: var(--accent);
    border: 0; border-radius: 999px; padding: 6px 16px; min-height: 36px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px; transition: filter .15s, background-color .2s;
  }
  .refresh:hover:not(:disabled) { filter: brightness(1.12); }
  .refresh:active:not(:disabled) { filter: brightness(.92); }
  .refresh:disabled { cursor: progress; }
  .refresh svg { width: 16px; height: 16px; flex: none; }
  .refresh.loading svg { animation: spin .8s linear infinite; }
  .refresh.done { background: var(--c5); }
  .refresh.fail { background: var(--c1); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .refresh.loading svg { animation: none; } }
  .search { position: relative; padding: 2px 0 8px; }
  .search input {
    width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; padding-inline-end: 40px;
    -webkit-appearance: none; appearance: none;
  }
  .search input::placeholder { color: var(--muted); }
  .search input::-webkit-search-cancel-button { display: none; }
  .search input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .search .clear {
    position: absolute; inset-inline-end: 6px; top: 50%; transform: translateY(-62%); width: 30px; height: 30px;
    font-size: 20px; line-height: 1; color: var(--muted); background: none; border: 0; border-radius: 50%; cursor: pointer;
  }
  .search .clear[hidden] { display: none; }
  .search .clear:focus-visible { outline: 3px solid var(--accent); }
  mark { background: color-mix(in srgb, var(--accent) 28%, transparent); color: inherit; border-radius: 2px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 12px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; display: inline-flex; align-items: center; gap: 8px; font: inherit; font-size: 15px;
    color: var(--ink); background: var(--chip); border: 1px solid var(--line); border-radius: 999px;
    padding: 4px 12px 4px 10px; cursor: pointer;
  }
  .chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--accent)); display: block; }
  .chip small { color: var(--muted); font-size: 13px; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .chip[aria-pressed="true"] small { color: inherit; opacity: .75; }
  .chip.off { opacity: .45; cursor: default; text-decoration: line-through; }
  @media (min-width: 700px) and (hover: hover) { .chips { flex-wrap: wrap; overflow: visible; } }
  .chip:focus-visible, .more:focus-visible, .refresh:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  main { padding: 16px 0 48px; }
  .gap-label { color: var(--muted); font-size: 14px; font-weight: 600; margin: 22px 0 8px; }
  .gap-label:first-child { margin-top: 0; }
  article {
    position: relative; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
    border-radius: 6px; padding: 12px 18px 12px 14px; margin-bottom: 10px;
    border-inline-start: 5px solid var(--c, var(--accent));
  }
  .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 14px; color: var(--muted); }
  .meta b { color: var(--ink); font-weight: 800; font-size: 15px; }
  .meta time { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .text { margin: 6px 0 0; white-space: pre-line; overflow-wrap: anywhere; }
  .text.clamp { display: -webkit-box; -webkit-line-clamp: 7; -webkit-box-orient: vertical; overflow: hidden; }
  .more { font: inherit; font-size: 14px; background: none; border: 0; color: var(--accent); padding: 4px 0 0; cursor: pointer; }
  .media { position: relative; margin-top: 10px; border-radius: 4px; overflow: hidden; background: var(--chip); }
  .media img { display: block; width: 100%; max-height: 420px; object-fit: cover; }
  .media .vid {
    position: absolute; inset-inline-start: 8px; bottom: 8px; background: rgba(0,0,0,.72); color: #fff;
    font-size: 13px; padding: 2px 10px; border-radius: 999px;
  }
  .src { display: inline-block; margin-top: 8px; font-size: 14px; color: var(--accent); }
  .empty, .err { text-align: center; color: var(--muted); padding: 48px 0; }
  .err b { color: var(--ink); display: block; margin-bottom: 4px; }
  footer { color: var(--muted); font-size: 13px; padding: 8px 0 32px; border-top: 1px solid var(--line); }
  .skeleton { height: 96px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); margin-bottom: 10px; opacity: .6; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="bar">
      <h1>מבזקי טלגרם</h1>
      <div class="status" id="status" aria-live="polite">טוען…</div>
    </div>
    <div class="search">
      <input type="search" id="q" placeholder="חיפוש בפוסטים…" aria-label="חיפוש בפוסטים" autocomplete="off" enterkeyhint="search">
      <button type="button" class="clear" id="qclear" aria-label="נקה חיפוש" hidden>×</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="סינון לפי ערוץ"></div>
  </div>
</header>

<main class="wrap" id="feed" aria-live="polite">
  <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
</main>

<footer class="wrap">
  הפוסטים שייכים לבעלי הערוצים ומוצגים כאן מהתצוגה הציבורית של טלגרם. כל פוסט מקשר למקור.
</footer>

<script>
(function () {
  var REFRESH_MS = 120000;
  var state = { data: null, filter: 'all', query: '', expanded: {}, failed: false, loading: false, flash: '' };
  var chipsEl = document.getElementById('chips');
  var feedEl = document.getElementById('feed');
  var statusEl = document.getElementById('status');
  var qEl = document.getElementById('q');
  var qClear = document.getElementById('qclear');
  var rtf = new Intl.RelativeTimeFormat('he', { numeric: 'auto' });
  var clock = new Intl.DateTimeFormat('he-IL', { hour: '2-digit', minute: '2-digit' });
  var dayFmt = new Intl.DateTimeFormat('he-IL', { weekday: 'long', day: 'numeric', month: 'long' });
  var compact = new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 1 });

  function colorOf(handle) {
    var list = (state.data && state.data.channels) || [];
    for (var i = 0; i < list.length; i++) if (list[i].handle === handle) return 'var(--c' + (i % 9) + ')';
    return 'var(--accent)';
  }
  function titleOf(handle) {
    var list = (state.data && state.data.channels) || [];
    for (var i = 0; i < list.length; i++) if (list[i].handle === handle) return list[i].title;
    return handle;
  }
  function rel(date) {
    var s = Math.round((new Date(date) - Date.now()) / 1000), a = Math.abs(s);
    if (a < 60) return 'עכשיו';
    if (a < 3600) return rtf.format(Math.round(s / 60), 'minute');
    if (a < 86400) return rtf.format(Math.round(s / 3600), 'hour');
    return rtf.format(Math.round(s / 86400), 'day');
  }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function bucket(date) {
    var d = new Date(date), now = new Date();
    if (now - d < 3600e3) return 'בשעה האחרונה';
    if (d.toDateString() === now.toDateString()) return 'היום';
    var y = new Date(now); y.setDate(now.getDate() - 1);
    if (d.toDateString() === y.toDateString()) return 'אתמול';
    return dayFmt.format(d);
  }

  function terms() { return state.query.toLowerCase().split(/\s+/).filter(Boolean); }
  function matches(p, ts) {
    var hay = ((p.text || '') + ' ' + titleOf(p.channel)).toLowerCase();
    return ts.every(function (t) { return hay.indexOf(t) !== -1; });
  }
  // fills node with text, wrapping search terms in <mark>
  function highlight(node, text, ts) {
    if (!ts.length) { node.textContent = text; return; }
    var low = text.toLowerCase(), pos = 0;
    while (pos < text.length) {
      var best = -1, len = 0;
      ts.forEach(function (t) {
        var i = low.indexOf(t, pos);
        if (i !== -1 && (best === -1 || i < best || (i === best && t.length > len))) { best = i; len = t.length; }
      });
      if (best === -1) break;
      if (best > pos) node.appendChild(document.createTextNode(text.slice(pos, best)));
      node.appendChild(el('mark', null, text.slice(best, best + len)));
      pos = best + len;
    }
    if (pos < text.length) node.appendChild(document.createTextNode(text.slice(pos)));
  }

  function renderChips() {
    chipsEl.textContent = '';
    var all = el('button', 'chip', 'הכל');
    all.type = 'button';
    all.setAttribute('aria-pressed', state.filter === 'all');
    all.onclick = function () { state.filter = 'all'; render(); };
    chipsEl.appendChild(all);
    state.data.channels.forEach(function (c, i) {
      var b = el('button', 'chip' + (c.ok ? '' : ' off'));
      b.type = 'button';
      b.style.setProperty('--c', 'var(--c' + (i % 9) + ')');
      b.appendChild(el('i'));
      b.appendChild(document.createTextNode(c.title));
      if (c.ok && c.subscribers) b.appendChild(el('small', null, compact.format(c.subscribers)));
      if (!c.ok) { b.disabled = true; b.title = 'לא זמין: ' + c.error; }
      b.setAttribute('aria-pressed', state.filter === c.handle);
      b.onclick = function () { state.filter = c.handle; render(); };
      chipsEl.appendChild(b);
    });
  }

  function renderPost(p, ts) {
    var a = el('article');
    a.style.setProperty('--c', colorOf(p.channel));
    var meta = el('div', 'meta');
    meta.appendChild(el('b', null, titleOf(p.channel)));
    var t = el('time', null, p.date ? rel(p.date) + ', ' + clock.format(new Date(p.date)) : '');
    if (p.date) t.dateTime = p.date;
    meta.appendChild(t);
    a.appendChild(meta);

    if (p.text) {
      var long = p.text.length > 420 || p.text.split('\n').length > 7;
      var key = p.channel + '/' + p.id;
      var txt = el('p', 'text' + (long && !state.expanded[key] ? ' clamp' : ''));
      highlight(txt, p.text, ts);
      txt.dir = 'auto';
      a.appendChild(txt);
      if (long) {
        var more = el('button', 'more', state.expanded[key] ? 'הצג פחות' : 'הצג עוד');
        more.type = 'button';
        more.onclick = function () { state.expanded[key] = !state.expanded[key]; render(); };
        a.appendChild(more);
      }
    }
    if (p.image) {
      var m = el('div', 'media');
      var img = document.createElement('img');
      img.src = p.image; img.alt = ''; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer';
      img.onerror = function () { m.remove(); };
      m.appendChild(img);
      if (p.hasVideo) m.appendChild(el('span', 'vid', 'וידאו בטלגרם'));
      a.appendChild(m);
    }
    var link = el('a', 'src', 'לפוסט המקורי');
    link.href = p.url; link.target = '_blank'; link.rel = 'noopener noreferrer';
    a.appendChild(link);
    return a;
  }

  function render() {
    if (!state.data) return;
    renderChips();
    var ts = terms();
    var posts = state.data.posts.slice().sort(function (x, y) { return (Date.parse(y.date) || 0) - (Date.parse(x.date) || 0); }).filter(function (p) {
      return (state.filter === 'all' || p.channel === state.filter) && (!ts.length || matches(p, ts));
    });
    feedEl.textContent = '';
    if (!posts.length) {
      feedEl.appendChild(el('div', 'empty', ts.length ? 'לא נמצאו פוסטים שמתאימים לחיפוש.' : 'אין פוסטים להצגה בערוץ הזה כרגע.'));
      return;
    }
    var last = null;
    posts.forEach(function (p) {
      var b = p.date ? bucket(p.date) : '';
      if (b !== last) { feedEl.appendChild(el('div', 'gap-label', b)); last = b; }
      feedEl.appendChild(renderPost(p, ts));
    });
  }

  var ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>';
  var flashTimer;

  function setStatus() {
    statusEl.textContent = '';
    var text = '';
    if (state.loading) text = state.data ? 'מרענן…' : 'טוען…';
    else if (state.flash === 'fail') text = state.data ? 'הרענון נכשל, מוצגים נתונים קודמים' : '';
    else if (state.data) {
      var ok = state.data.channels.filter(function (c) { return c.ok; }).length;
      text = 'עודכן ' + clock.format(new Date(state.data.updated)) + ' · ' + ok + ' ערוצים';
    }
    if (text) statusEl.appendChild(el('span', null, text));
    var b = el('button', 'refresh' + (state.loading ? ' loading' : '') + (state.flash ? ' ' + state.flash : ''));
    b.type = 'button';
    b.innerHTML = ICON;
    b.appendChild(document.createTextNode(
      state.loading ? 'מרענן' : state.flash === 'done' ? 'עודכן ✓' : state.flash === 'fail' ? 'נסו שוב' : 'רענון'));
    b.disabled = state.loading;
    b.onclick = function () { load(true); };
    statusEl.appendChild(b);
  }

  function setFlash(kind) {
    state.flash = kind;
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function () { state.flash = ''; setStatus(); }, kind === 'fail' ? 6000 : 2500);
  }

  // manual = user pressed the button: bypass the 2-minute edge cache and confirm visibly
  function load(manual) {
    if (state.loading) return Promise.resolve();
    state.loading = true; state.flash = ''; clearTimeout(flashTimer);
    setStatus();
    var t0 = Date.now();
    return fetch('/api/feed' + (manual === true ? '?r=' + t0 : ''), { cache: 'no-store' })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw j; return j; }); })
      .then(function (j) { state.data = j; state.failed = false; return true; }, function () { return false; })
      .then(function (ok) {
        // keep the spinner visible long enough to notice
        var wait = manual === true ? Math.max(0, 600 - (Date.now() - t0)) : 0;
        return new Promise(function (res) { setTimeout(function () { res(ok); }, wait); });
      })
      .then(function (ok) {
        state.loading = false;
        if (ok) {
          if (manual === true) setFlash('done');
          setStatus(); render();
        } else {
          if (state.data) setFlash('fail');
          else {
            feedEl.textContent = '';
            var box = el('div', 'err');
            box.appendChild(el('b', null, 'לא הצלחנו לטעון פוסטים'));
            box.appendChild(document.createTextNode('טלגרם לא החזיר נתונים מאף ערוץ. נסו שוב בעוד רגע.'));
            feedEl.appendChild(box);
          }
          setStatus();
        }
      });
  }

  qEl.addEventListener('input', function () {
    state.query = qEl.value.trim();
    qClear.hidden = !qEl.value;
    render();
  });
  qClear.onclick = function () { qEl.value = ''; state.query = ''; qClear.hidden = true; render(); qEl.focus(); };

  load();
  setInterval(function () { if (!document.hidden) load(); }, REFRESH_MS);
  setInterval(function () { if (!document.hidden && state.data) render(); }, 60000); // keep "x minutes ago" fresh
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
})();
</script>
</body>
</html>
