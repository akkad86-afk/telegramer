<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מבזקי טלגרם</title>
<meta name="description" content="הפוסטים האחרונים מערוצי חדשות ציבוריים בטלגרם, במקום אחד.">
<meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="מבזקים">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Frank+Ruhl+Libre:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f3ee;
    --surface: #ffffff;
    --ink: #16181d;
    --ink-2: #3a3e47;
    --muted: #6b6f78;
    --line: #e4e0d8;
    --rail: #dcd7cc;
    --link: #0a6a8a;
    --live: #d92d20;
    --ok: #2f7d3a;
    --mark: #ffe58a;
    --btn: #16181d;
    --btn-ink: #ffffff;
    --chip: #ebe8e1;
    --shadow: 0 1px 2px rgba(22,24,29,.04), 0 6px 20px rgba(22,24,29,.05);
    --c0: #0b6e6e; --c1: #b4491f; --c2: #4a5bb5; --c3: #8a6a00; --c4: #a3366b;
    --c5: #2f7d3a; --c6: #6a4c93; --c7: #1c6fa8; --c8: #7a5a44;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1014; --surface: #171a20; --ink: #eceae4; --ink-2: #c9c7c1; --muted: #9a9ea8;
      --line: #262a32; --rail: #2c313a; --link: #6cc3e0; --live: #ff5a4e; --ok: #6fc67b;
      --mark: rgba(255, 214, 90, .38); --btn: #eceae4; --btn-ink: #0e1014; --chip: #1e2229;
      --shadow: none;
      --c0: #4fc1bd; --c1: #f0925f; --c2: #8c9bf0; --c3: #e0bb4a; --c4: #e57fb0;
      --c5: #6fc67b; --c6: #b39ae0; --c7: #63b2ec; --c8: #c9a48c;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Assistant", "Segoe UI", Arial, sans-serif; font-size: 17px; line-height: 1.6;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding-inline: 16px; }
  button { font: inherit; }

  /* ================= header ================= */
  header {
    position: sticky; top: 0; z-index: 5;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    -webkit-backdrop-filter: saturate(1.4) blur(12px); backdrop-filter: saturate(1.4) blur(12px);
    border-bottom: 1px solid var(--line);
    padding-top: env(safe-area-inset-top, 0px);
    margin-top: calc(env(safe-area-inset-top, 0px) * -1);
    transition: transform .28s ease;
  }
  header.hide { transform: translateY(-100%); }
  .bar { display: flex; align-items: center; gap: 10px; padding: 12px 0 10px; }
  .brand { display: flex; align-items: center; gap: 10px; flex: none; }
  h1 {
    margin: 0; font-family: "Frank Ruhl Libre", Georgia, serif; font-weight: 900;
    font-size: 25px; line-height: 1.1; letter-spacing: -.01em;
  }
  .live {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; letter-spacing: .04em;
    color: var(--live); border: 1.5px solid currentColor; border-radius: 999px; padding: 1px 8px 1px 9px; line-height: 1.5;
  }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; position: relative; }
  .live i::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%; background: currentColor;
    animation: ping 1.8s cubic-bezier(0, 0, .2, 1) infinite;
  }
  .live.off { color: var(--muted); }
  .live.off i::after { animation: none; }
  @keyframes ping { 75%, 100% { transform: scale(2.6); opacity: 0; } }
  .stext { flex: 1; min-width: 0; color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: end; }

  .refresh {
    flex: none; font-size: 15px; font-weight: 700; color: var(--btn-ink); background: var(--btn);
    border: 0; border-radius: 999px; width: 38px; height: 38px; padding: 0; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    transition: transform .12s, background-color .2s, opacity .15s;
  }
  .refresh:hover:not(:disabled) { opacity: .88; }
  .refresh:active:not(:disabled) { transform: scale(.96); }
  .refresh:disabled { cursor: progress; }
  .refresh svg { width: 17px; height: 17px; flex: none; }
  .refresh .rlabel { display: none; }
  .refresh.loading svg { animation: spin .8s linear infinite; }
  .refresh.done { background: var(--ok); color: #fff; }
  .refresh.fail { background: var(--live); color: #fff; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .search { position: relative; padding: 0 0 10px; }
  .search svg {
    position: absolute; inset-inline-start: 14px; top: 20px; transform: translateY(-50%);
    width: 17px; height: 17px; color: var(--muted); pointer-events: none;
  }
  .search input {
    width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px; height: 40px;
    padding: 0 40px; -webkit-appearance: none; appearance: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .search input::placeholder { color: var(--muted); }
  .search input::-webkit-search-cancel-button { display: none; }
  .search input:focus { outline: none; border-color: var(--ink-2); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 12%, transparent); }
  .search .clear {
    position: absolute; inset-inline-end: 5px; top: 20px; transform: translateY(-50%); width: 32px; height: 32px;
    font-size: 20px; line-height: 1; color: var(--muted); background: none; border: 0; border-radius: 50%; cursor: pointer;
  }
  .search .clear:hover { background: var(--chip); color: var(--ink); }
  .search .clear[hidden] { display: none; }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }

  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 12px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; display: inline-flex; align-items: center; gap: 7px; font-size: 14.5px; font-weight: 600;
    color: var(--ink-2); background: transparent; border: 1px solid var(--line); border-radius: 999px;
    padding: 4px 12px 4px 11px; cursor: pointer; transition: background-color .15s, border-color .15s, color .15s;
  }
  .chip:hover { background: var(--chip); }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--ink)); display: block; }
  .chip small { color: var(--muted); font-size: 12.5px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .chip[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
  .chip[aria-pressed="true"] small { color: inherit; opacity: .7; }
  .chip[aria-pressed="true"] i { box-shadow: 0 0 0 2px var(--btn-ink); }

  .chip:focus-visible, .more:focus-visible, .refresh:focus-visible, .newbar:focus-visible, .clear:focus-visible,
  a:focus-visible { outline: 3px solid var(--link); outline-offset: 2px; }

  @media (min-width: 480px) {
    .refresh { width: auto; padding: 0 16px; }
    .refresh .rlabel { display: inline; }
  }
  @media (min-width: 600px) {
    h1 { font-size: 30px; }
    .stext { font-size: 13.5px; }
    .bar { padding: 16px 0 12px; }
  }
  @media (min-width: 700px) and (hover: hover) { .chips { flex-wrap: wrap; overflow: visible; } }

  /* ================= feed: a timeline rail ================= */
  main { padding-top: 20px; padding-bottom: 40px; }
  .rail { position: relative; padding-inline-start: 26px; }
  .rail::before {
    content: ""; position: absolute; inset-inline-start: 7px; top: 6px; bottom: 0; width: 2px;
    background: linear-gradient(var(--rail), var(--rail) 85%, transparent);
  }
  .gap-label {
    position: relative; margin: 26px 0 12px; font-size: 13px; font-weight: 800; letter-spacing: .02em; color: var(--muted);
  }
  .gap-label::before {
    content: ""; position: absolute; inset-inline-start: -26px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; border-radius: 50%; background: var(--bg); border: 2px solid var(--rail);
  }
  .rail > .gap-label:first-child, .notice + .gap-label { margin-top: 0; }

  .notice {
    display: flex; gap: 8px; align-items: baseline;
    color: var(--muted); font-size: 13.5px; margin: 0 0 20px; padding: 8px 12px; border-radius: 10px;
    background: var(--chip);
  }

  article {
    position: relative; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
    border-radius: 14px; padding: 14px 16px 14px; margin-bottom: 12px;
  }
  article::before {      /* the dot on the rail */
    content: ""; position: absolute; inset-inline-start: -25px; top: 24px; width: 10px; height: 10px; border-radius: 50%;
    background: var(--c, var(--ink)); box-shadow: 0 0 0 3px var(--bg);
  }
  article.breaking { border-color: color-mix(in srgb, var(--live) 45%, var(--line)); }
  article.breaking::before { background: var(--live); }
  article.fresh { animation: fresh 3.5s ease-out; }
  @keyframes fresh {
    0% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--c, var(--link)) 45%, transparent), var(--shadow); }
    100% { box-shadow: 0 0 0 3px transparent, var(--shadow); }
  }

  .head { display: flex; align-items: center; gap: 10px; }
  .avatar {
    flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
    font-size: 14px; font-weight: 800; line-height: 1; color: var(--c, var(--ink));
    background: color-mix(in srgb, var(--c, var(--ink)) 14%, var(--surface));
  }
  .who { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
  .who b { font-size: 15.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .when { color: var(--muted); font-size: 13px; text-decoration: none; white-space: nowrap; font-variant-numeric: tabular-nums; margin-top: 2px; width: max-content; }
  .when span { opacity: .55; margin-inline-start: 4px; }
  .when:hover { color: var(--link); }
  .when:hover time { text-decoration: underline; }
  .tag {
    flex: none; align-self: flex-start; font-size: 12px; font-weight: 800; color: #fff; background: var(--live);
    border-radius: 6px; padding: 1px 8px; letter-spacing: .02em;
  }

  .text { margin: 10px 0 0; white-space: pre-line; overflow-wrap: anywhere; color: var(--ink); }
  .text a { color: var(--link); text-decoration-thickness: 1px; text-underline-offset: 2px; }
  .text.clamp { display: -webkit-box; -webkit-line-clamp: 7; -webkit-box-orient: vertical; overflow: hidden; }
  .more {
    display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 700; background: none; border: 0;
    color: var(--link); padding: 6px 0 0; cursor: pointer;
  }
  .media { position: relative; display: block; margin-top: 12px; border-radius: 10px; overflow: hidden; background: var(--chip); }
  .media img { display: block; width: 100%; max-height: 440px; object-fit: cover; transition: transform .4s ease; }
  .media:hover img { transform: scale(1.015); }
  .media .vid {
    position: absolute; inset-inline-start: 10px; bottom: 10px; display: inline-flex; align-items: center; gap: 6px;
    background: rgba(0,0,0,.72); color: #fff; font-size: 13px; font-weight: 600; padding: 3px 11px 3px 9px; border-radius: 999px;
  }

  .empty, .err { text-align: center; color: var(--muted); padding: 56px 16px; }
  .empty b, .err b { color: var(--ink); display: block; margin-bottom: 4px; font-size: 18px; }
  footer { color: var(--muted); font-size: 13px; text-align: center; padding: 20px 16px 36px; }

  .skeleton { height: 118px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); margin-bottom: 12px; position: relative; overflow: hidden; }
  .skeleton::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--chip) 80%, transparent), transparent);
    animation: shimmer 1.3s infinite; transform: translateX(100%);
  }
  @keyframes shimmer { to { transform: translateX(-100%); } }

  /* "N new posts" pill */
  .newbar {
    position: fixed; z-index: 10; inset-inline: 0; margin: 0 auto; width: max-content; max-width: calc(100% - 32px);
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    font-size: 15px; font-weight: 700; color: var(--btn-ink); background: var(--btn);
    border: 0; border-radius: 999px; padding: 10px 20px; cursor: pointer;
    box-shadow: 0 6px 24px rgba(0,0,0,.25); animation: rise .3s ease-out;
  }
  .newbar[hidden] { display: none; }
  @keyframes rise { from { transform: translateY(12px); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<header id="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand">
        <h1>מבזקי טלגרם</h1>
        <span class="live" id="live" title="מתעדכן אוטומטית"><i></i>חי</span>
      </div>
      <span class="stext" id="stext" aria-live="polite">טוען…</span>
      <button type="button" class="refresh" id="refresh" aria-label="רענון">
        <svg id="ricon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
        <span class="rlabel" id="rlabel">רענון</span>
      </button>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="q" placeholder="חיפוש בפוסטים" aria-label="חיפוש בפוסטים" autocomplete="off" enterkeyhint="search">
      <button type="button" class="clear" id="qclear" aria-label="נקה חיפוש" hidden>×</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="סינון לפי ערוץ"></div>
  </div>
</header>

<main class="wrap">
  <div class="rail" id="feed">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>
</main>

<footer>
  הפוסטים שייכים לבעלי הערוצים ומוצגים מהתצוגה הציבורית של טלגרם. כל פוסט מקשר למקור.
</footer>

<button type="button" class="newbar" id="newbar" hidden></button>

<script>
(function () {
  var REFRESH_MS = 120000;
  var TITLE = document.title;
  var state = {
    data: null, pending: null, filter: 'all', query: '', expanded: {}, fresh: {},
    loading: false, flash: '', incoming: null, lastFailed: false
  };
  var headerEl = document.getElementById('top');
  var chipsEl = document.getElementById('chips');
  var feedEl = document.getElementById('feed');
  var stextEl = document.getElementById('stext');
  var liveEl = document.getElementById('live');
  var refreshEl = document.getElementById('refresh');
  var ricon = document.getElementById('ricon');
  var rlabel = document.getElementById('rlabel');
  var newbar = document.getElementById('newbar');
  var qEl = document.getElementById('q');
  var qClear = document.getElementById('qclear');
  var rtf = new Intl.RelativeTimeFormat('he', { numeric: 'auto' });
  var clock = new Intl.DateTimeFormat('he-IL', { hour: '2-digit', minute: '2-digit' });
  var dayFmt = new Intl.DateTimeFormat('he-IL', { weekday: 'long', day: 'numeric', month: 'long' });
  var compact = new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 1 });
  var reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function chanOf(handle) {
    var list = (state.data && state.data.channels) || [];
    for (var i = 0; i < list.length; i++) if (list[i].handle === handle) return { i: i, c: list[i] };
    return null;
  }
  function colorOf(handle) { var f = chanOf(handle); return f ? 'var(--c' + (f.i % 9) + ')' : 'var(--ink)'; }
  function titleOf(handle) { var f = chanOf(handle); return f ? f.c.title : handle; }
  // two letters for the avatar: first letter of the first two words
  function initials(name) {
    var words = String(name).split(/\s+/).map(function (w) {
      var m = w.match(/[\p{L}\p{N}]/u); return m ? m[0] : '';
    }).filter(Boolean);
    return (words.slice(0, 2).join('') || '?').toUpperCase();
  }
  function rel(date) {
    var s = Math.round((new Date(date) - Date.now()) / 1000), a = Math.abs(s);
    if (a < 60) return 'עכשיו';
    if (a < 3600) return rtf.format(Math.round(s / 60), 'minute');
    if (a < 86400) return rtf.format(Math.round(s / 3600), 'hour');
    return rtf.format(Math.round(s / 86400), 'day');
  }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function bucket(date) {
    var d = new Date(date), now = new Date();
    if (now - d < 3600e3) return 'בשעה האחרונה';
    if (d.toDateString() === now.toDateString()) return 'מוקדם יותר היום';
    var y = new Date(now); y.setDate(now.getDate() - 1);
    if (d.toDateString() === y.toDateString()) return 'אתמול';
    return dayFmt.format(d);
  }
  function keyOf(p) { return p.channel + '/' + p.id; }
  var BREAKING_RE = /^[\s🔴🚨❗‼️⚡️*_]*(מבזק|דחוף|breaking|urgent)/i;

  /* ---- shareable state in the URL hash: #c=<channel>&q=<search> ---- */
  function readHash() {
    var hp = new URLSearchParams(location.hash.replace(/^#/, ''));
    state.filter = hp.get('c') || 'all';
    state.query = (hp.get('q') || '').trim();
    qEl.value = state.query;
    qClear.hidden = !state.query;
  }
  function syncUrl() {
    try {
      var hp = new URLSearchParams();
      if (state.filter !== 'all') hp.set('c', state.filter);
      if (state.query) hp.set('q', state.query);
      var h = hp.toString();
      history.replaceState(null, '', location.pathname + location.search + (h ? '#' + h : ''));
    } catch (e) { /* sandboxed or file:// */ }
  }

  /* ---- text: search highlight + clickable links ---- */
  function terms() { return state.query.toLowerCase().split(/\s+/).filter(Boolean); }
  function matches(p, ts) {
    var hay = ((p.text || '') + ' ' + titleOf(p.channel)).toLowerCase();
    return ts.every(function (t) { return hay.indexOf(t) !== -1; });
  }
  // appends text to node, wrapping search terms in <mark>
  function highlight(node, text, ts) {
    if (!ts.length) { node.appendChild(document.createTextNode(text)); return; }
    var low = text.toLowerCase(), pos = 0;
    while (pos < text.length) {
      var best = -1, len = 0;
      ts.forEach(function (t) {
        var i = low.indexOf(t, pos);
        if (i !== -1 && (best === -1 || i < best || (i === best && t.length > len))) { best = i; len = t.length; }
      });
      if (best === -1) break;
      if (best > pos) node.appendChild(document.createTextNode(text.slice(pos, best)));
      node.appendChild(el('mark', null, text.slice(best, best + len)));
      pos = best + len;
    }
    if (pos < text.length) node.appendChild(document.createTextNode(text.slice(pos)));
  }
  function shortUrl(u) {
    var s = u.replace(/^https?:\/\//, '').replace(/^www\./, '').replace(/\/$/, '');
    return s.length > 40 ? s.slice(0, 38) + '…' : s;
  }
  var URL_RE = /https?:\/\/[^\s<>"]+/g;
  function renderText(node, text, ts) {
    var pos = 0, m;
    URL_RE.lastIndex = 0;
    while ((m = URL_RE.exec(text))) {
      var url = m[0].replace(/[.,;:!?)\]'"׳״]+$/, '');   // trailing punctuation is not part of the link
      if (m.index > pos) highlight(node, text.slice(pos, m.index), ts);
      var a = document.createElement('a');
      a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer nofollow';
      a.dir = 'ltr';
      highlight(a, shortUrl(url), ts);
      node.appendChild(a);
      pos = m.index + url.length;
      URL_RE.lastIndex = pos;
    }
    if (pos < text.length) highlight(node, text.slice(pos), ts);
  }

  /* ---- rendering ---- */
  function renderChips() {
    chipsEl.textContent = '';
    function pick(v) { state.filter = v; syncUrl(); render(); }
    var all = el('button', 'chip', 'הכל');
    all.type = 'button';
    all.setAttribute('aria-pressed', state.filter === 'all');
    all.onclick = function () { pick('all'); };
    chipsEl.appendChild(all);
    state.data.channels.forEach(function (c, i) {
      if (!c.ok) return;                         // unavailable channels are listed in a note instead
      var b = el('button', 'chip');
      b.type = 'button';
      b.style.setProperty('--c', 'var(--c' + (i % 9) + ')');
      b.appendChild(el('i'));
      b.appendChild(document.createTextNode(c.title));
      if (c.subscribers) b.appendChild(el('small', null, compact.format(c.subscribers)));
      b.setAttribute('aria-pressed', state.filter === c.handle);
      b.onclick = function () { pick(c.handle); };
      chipsEl.appendChild(b);
    });
  }

  function renderPost(p, ts) {
    var breaking = BREAKING_RE.test(p.text || '');
    var a = el('article', (state.fresh[keyOf(p)] ? 'fresh' : '') + (breaking ? ' breaking' : ''));
    a.style.setProperty('--c', colorOf(p.channel));

    var head = el('div', 'head');
    var title = titleOf(p.channel);
    var av = el('span', 'avatar', initials(title));
    av.setAttribute('aria-hidden', 'true');
    head.appendChild(av);
    var who = el('div', 'who');
    who.appendChild(el('b', null, title));
    var link = document.createElement('a');
    link.className = 'when'; link.href = p.url; link.target = '_blank'; link.rel = 'noopener noreferrer';
    link.title = 'פתיחה בטלגרם';
    var t = el('time', null, p.date ? rel(p.date) + ' · ' + clock.format(new Date(p.date)) : 'פתיחה בטלגרם');
    if (p.date) t.dateTime = p.date;
    link.appendChild(t);
    var arrow = el('span', null, '↗'); arrow.setAttribute('aria-hidden', 'true');
    link.appendChild(arrow);
    who.appendChild(link);
    head.appendChild(who);
    if (breaking) head.appendChild(el('span', 'tag', 'מבזק'));
    a.appendChild(head);

    if (p.text) {
      var long = p.text.length > 420 || p.text.split('\n').length > 7;
      var key = keyOf(p);
      var txt = el('p', 'text' + (long && !state.expanded[key] ? ' clamp' : ''));
      renderText(txt, p.text, ts);
      txt.dir = 'auto';
      a.appendChild(txt);
      if (long) {
        var more = el('button', 'more', state.expanded[key] ? 'הצג פחות ▴' : 'הצג עוד ▾');
        more.type = 'button';
        more.onclick = function () { state.expanded[key] = !state.expanded[key]; render(); };
        a.appendChild(more);
      }
    }
    if (p.image) {
      var m = document.createElement('a');
      m.className = 'media'; m.href = p.url; m.target = '_blank'; m.rel = 'noopener noreferrer';
      m.setAttribute('aria-label', 'פתיחה בטלגרם');
      var img = document.createElement('img');
      img.src = p.image; img.alt = ''; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer';
      img.onerror = function () { m.remove(); };
      m.appendChild(img);
      if (p.hasVideo) m.appendChild(el('span', 'vid', '▶ וידאו בטלגרם'));
      a.appendChild(m);
    }
    return a;
  }

  function render() {
    if (!state.data) return;
    var chans = state.data.channels;
    if (state.filter !== 'all' && !chans.some(function (c) { return c.ok && c.handle === state.filter; })) {
      state.filter = 'all'; syncUrl();            // stale or unavailable channel in the link
    }
    renderChips();
    var ts = terms();
    var posts = state.data.posts.slice().sort(function (x, y) { return (Date.parse(y.date) || 0) - (Date.parse(x.date) || 0); }).filter(function (p) {
      return (state.filter === 'all' || p.channel === state.filter) && (!ts.length || matches(p, ts));
    });
    feedEl.textContent = '';
    var bad = chans.filter(function (c) { return !c.ok; });
    if (bad.length) {
      var names = bad.map(function (c) { return c.title; }).join(', ');
      var n = el('div', 'notice');
      n.appendChild(el('span', null, '⚠')).setAttribute('aria-hidden', 'true');
      n.appendChild(el('span', null, (bad.length === 1 ? 'ערוץ אחד לא זמין כרגע: ' : bad.length + ' ערוצים לא זמינים כרגע: ') + names));
      n.title = bad.map(function (c) { return c.title + ' – ' + (c.error || ''); }).join('\n');
      feedEl.appendChild(n);
    }
    if (!posts.length) {
      var e = el('div', 'empty');
      e.appendChild(el('b', null, ts.length ? 'לא נמצאו תוצאות' : 'אין פוסטים כרגע'));
      e.appendChild(document.createTextNode(ts.length ? 'נסו מילה אחרת, או בחרו "הכל".' : 'אין פוסטים להצגה בערוץ הזה כרגע.'));
      feedEl.appendChild(e);
      return;
    }
    var last = null;
    posts.forEach(function (p) {
      var b = p.date ? bucket(p.date) : '';
      if (b !== last) { feedEl.appendChild(el('div', 'gap-label', b)); last = b; }
      feedEl.appendChild(renderPost(p, ts));
    });
  }

  /* ---- header status + refresh button ---- */
  var PATHS = {
    refresh: '<path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>',
    done: '<path d="M5 12.5l4.5 4.5L19 7.5"/>'
  };
  var flashTimer;

  function setStatus() {
    var latest = state.pending || state.data;
    var text = '';
    if (state.loading) text = state.data ? 'מרענן…' : 'טוען…';
    else if (state.flash === 'fail') text = state.data ? 'הרענון נכשל' : '';
    else if (latest) {
      var ok = latest.channels.filter(function (c) { return c.ok; }).length;
      text = 'עודכן ' + clock.format(new Date(latest.updated)) + ' · ' + ok + ' ערוצים';
    }
    stextEl.textContent = text;
    liveEl.className = 'live' + (state.lastFailed ? ' off' : '');
    liveEl.title = state.lastFailed ? 'הרענון האחרון נכשל' : 'מתעדכן אוטומטית כל 2 דקות';
    var label = state.loading ? 'מרענן' : state.flash === 'done' ? 'עודכן' : state.flash === 'fail' ? 'נסו שוב' : 'רענון';
    refreshEl.className = 'refresh' + (state.loading ? ' loading' : '') + (state.flash ? ' ' + state.flash : '');
    refreshEl.disabled = state.loading;
    refreshEl.setAttribute('aria-label', label);
    rlabel.textContent = label;
    ricon.innerHTML = state.flash === 'done' ? PATHS.done : PATHS.refresh;
  }

  function setFlash(kind) {
    state.flash = kind;
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function () { state.flash = ''; setStatus(); }, kind === 'fail' ? 6000 : 2500);
  }

  /* ---- applying data / "N new posts" pill ---- */
  function newCount(j) {
    if (!state.data) return 0;
    var seen = {};
    state.data.posts.forEach(function (p) { seen[keyOf(p)] = 1; });
    return j.posts.filter(function (p) { return !seen[keyOf(p)]; }).length;
  }
  function hideNewbar() { newbar.hidden = true; document.title = TITLE; }
  function applyData(j) {
    var fresh = {};
    if (state.data) {
      var seen = {};
      state.data.posts.forEach(function (p) { seen[keyOf(p)] = 1; });
      j.posts.forEach(function (p) { if (!seen[keyOf(p)]) fresh[keyOf(p)] = 1; });
    }
    state.data = j; state.pending = null; state.fresh = fresh;
    hideNewbar();
    setStatus(); render();
    state.fresh = {};
  }
  function holdPending(j, n) {
    state.pending = j;
    newbar.textContent = '↑ ' + (n === 1 ? 'פוסט חדש אחד' : n + ' פוסטים חדשים');
    newbar.hidden = false;
    document.title = '(' + n + ') ' + TITLE;
    setStatus();
  }
  newbar.onclick = function () {
    if (state.pending) applyData(state.pending);
    window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
  };

  // manual = user pressed the button: bypass the 2-minute edge cache (at most one fresh scrape per 15 s)
  function load(manual) {
    if (state.loading) return Promise.resolve();
    state.loading = true; state.flash = ''; clearTimeout(flashTimer);
    setStatus();
    var t0 = Date.now();
    return fetch('/api/feed' + (manual === true ? '?r=' + Math.floor(t0 / 15000) : ''), { cache: 'no-store' })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw j; return j; }); })
      .then(function (j) { state.incoming = j; return true; }, function () { return false; })
      .then(function (ok) {
        // keep the spinner visible long enough to notice
        var wait = manual === true ? Math.max(0, 600 - (Date.now() - t0)) : 0;
        return new Promise(function (res) { setTimeout(function () { res(ok); }, wait); });
      })
      .then(function (ok) {
        state.loading = false;
        state.lastFailed = !ok;
        if (ok) {
          var j = state.incoming, n = newCount(j);
          if (manual === true) setFlash('done');
          // don't shove posts around under a reader who has scrolled down: offer a pill instead
          if (manual !== true && n > 0 && window.scrollY > 80) holdPending(j, n);
          else applyData(j);
        } else {
          if (state.data) setFlash('fail');
          else {
            feedEl.textContent = '';
            var box = el('div', 'err');
            box.appendChild(el('b', null, 'לא הצלחנו לטעון פוסטים'));
            box.appendChild(document.createTextNode('טלגרם לא החזיר נתונים מאף ערוץ. נסו שוב בעוד רגע.'));
            feedEl.appendChild(box);
          }
          setStatus();
        }
      });
  }

  /* ---- events ---- */
  refreshEl.onclick = function () { load(true); };
  qEl.addEventListener('input', function () {
    state.query = qEl.value.trim();
    qClear.hidden = !qEl.value;
    syncUrl(); render();
  });
  qClear.onclick = function () { qEl.value = ''; state.query = ''; qClear.hidden = true; syncUrl(); render(); qEl.focus(); };
  window.addEventListener('hashchange', function () { readHash(); render(); });

  // header slides away when scrolling down, returns on any scroll up
  var lastY = 0;
  window.addEventListener('scroll', function () {
    var y = Math.max(0, window.scrollY), d = y - lastY;
    if (Math.abs(d) > 6) {
      if (d > 0 && y > 140 && document.activeElement !== qEl) headerEl.classList.add('hide');
      else if (d < 0) headerEl.classList.remove('hide');
      lastY = y;
    }
    if (y <= 140) headerEl.classList.remove('hide');
    if (state.pending && y <= 80) applyData(state.pending);
  }, { passive: true });
  headerEl.addEventListener('focusin', function () { headerEl.classList.remove('hide'); });

  readHash();
  setStatus();
  load();
  setInterval(function () { if (!document.hidden) load(); }, REFRESH_MS);
  setInterval(function () { if (!document.hidden && state.data) render(); }, 60000); // keep "x minutes ago" fresh
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
})();
</script>
</body>
</html>
